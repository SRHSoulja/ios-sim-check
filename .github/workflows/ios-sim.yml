# Open public URLs in Mobile Safari on an iOS Simulator and save screenshots.
# Run: gh workflow run ios-sim.yml -R SRHSoulja/ios-sim-check -f urls="https://example.com https://example.org" -f wait=20
name: ios-sim
on:
  workflow_dispatch:
    inputs:
      urls: { description: "space-separated public URLs", required: true }
      wait: { description: "seconds to wait after each page opens", required: false, default: "20" }
      device: { description: "simulator device name (blank = newest iPhone)", required: false, default: "" }
permissions: { contents: read }
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          NAME="${{ inputs.device }}"
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -E "^\s+iPhone [0-9]+ \(" | tail -1 | sed -E 's/^ +(iPhone [0-9]+) \(.*/\1/'); fi
          UDID=$(xcrun simctl list devices available | grep -F "$NAME (" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device=$NAME udid=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl getenv "$UDID" SIMULATOR_RUNTIME_VERSION | tee runtime.txt || true
      - name: Open each URL in Mobile Safari and screenshot
        run: |
          set -uo pipefail
          mkdir -p shots
          UDID="${{ steps.sim.outputs.udid }}"; W="${{ inputs.wait }}"; i=0
          for u in ${{ inputs.urls }}; do
            i=$((i+1)); n=$(printf '%02d' $i)
            echo "$n $u" | tee -a shots/index.txt
            xcrun simctl openurl "$UDID" "$u"
            sleep "$W"
            xcrun simctl io "$UDID" screenshot "shots/$n.png"
            sleep 3
            xcrun simctl io "$UDID" screenshot "shots/$n-b.png"
          done
          echo "device: ${{ steps.sim.outputs.name }}" >> shots/index.txt
          cat runtime.txt >> shots/index.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: ios-shots, path: shots, retention-days: 7 }
