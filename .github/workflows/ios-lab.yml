# The room check in Mobile Safari on an iOS Simulator with page access: ios_webkit_debug_proxy on the simulator's
# web inspector socket, scripts/ios-room.mjs (feature probe, menu -> Diorama, pinch, tap the computer; taps are
# synthetic pointer events in the page). Run:
#   gh workflow run ios-lab.yml -R SRHSoulja/ios-sim-check -f urls="https://straycucks.com/alive/312#pchtml&perf"
name: ios-lab
on:
  workflow_dispatch:
    inputs:
      urls: { description: "space-separated public room URLs", required: true }
      device: { description: "simulator device name (blank = newest iPhone)", required: false, default: "" }
permissions: { contents: read }
jobs:
  lab:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: ios_webkit_debug_proxy
        run: brew install ios-webkit-debug-proxy 2>&1 | tail -3
      - name: Boot an iPhone simulator
        id: sim
        env: { DEVICE: "${{ inputs.device }}" }
        run: |
          set -euo pipefail
          NAME="$DEVICE"
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -E "^\s+iPhone [0-9]+ \(" | tail -1 | sed -E 's/^ +(iPhone [0-9]+) \(.*/\1/'); fi
          UDID=$(xcrun simctl list devices available | grep -F "$NAME (" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"; echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p shots; { echo "device: $NAME"; xcrun simctl getenv "$UDID" SIMULATOR_RUNTIME_VERSION; } | tee shots/index.txt
      - name: Safari, proxy, room checks
        # inputs through env only (an & in a URL broke the shell, 2026-11-03)
        env: { URLS: "${{ inputs.urls }}", UDID: "${{ steps.sim.outputs.udid }}" }
        run: |
          set -uo pipefail
          read -ra LIST <<< "$URLS"
          xcrun simctl openurl "$UDID" "about:blank" || true; sleep 15
          SOCK=$(lsof -aUc launchd_sim 2>/dev/null | grep -o '/[^ ]*webinspectord_sim.socket' | head -1)
          [ -n "$SOCK" ] || SOCK=$(find /private/tmp -name 'com.apple.webinspectord_sim.socket' 2>/dev/null | head -1)
          echo "inspector socket: ${SOCK:-none}" | tee -a shots/index.txt
          ios_webkit_debug_proxy -s "unix:$SOCK" > shots/iwdp.log 2>&1 &
          sleep 3; curl -s http://localhost:9221/json | tee -a shots/index.txt
          i=0
          for u in "${LIST[@]}"; do
            i=$((i+1)); echo "u$i $u" | tee -a shots/index.txt
            ok=0; for t in 1 2 3; do if xcrun simctl openurl "$UDID" "$u"; then ok=1; break; fi; sleep 10; done
            [ "$ok" = 1 ] || { echo "u$i FAILED to open" | tee -a shots/index.txt; continue; }
            sleep 12
            curl -s http://localhost:9222/json > "shots/u$i-pages.json" || true
            timeout 900 node scripts/ios-room.mjs shots "ios-u$i" "$UDID" "straycucks.com" 2>&1 | tee -a shots/lab.log || echo "u$i ios-room exit $?" | tee -a shots/index.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-lab, path: shots, retention-days: 7 }
